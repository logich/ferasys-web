<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <meta name="author" content="Logan Browne, Feral Systems">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <meta name="keywords" content="Feral AI, Shadow AI, AI governance, behavioral security, nudge theory, choice architecture, CIO advisory, shadow IT">
    <link rel="canonical" href="{{canonical}}">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" sizes="192x192" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Feral Systems">
    <meta property="og:url" content="{{og_url}}">
    <meta property="og:title" content="{{og_title}}">
    <meta property="og:description" content="{{og_description}}">
    <meta property="og:image" content="https://ferasys.com/wolf-mark.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="1024">
    <meta property="og:updated_time" content="2026-05-27">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{twitter_title}}">
    <meta name="twitter:description" content="{{twitter_description}}">
    <meta name="twitter:image" content="https://ferasys.com/wolf-mark.png">

</head>
<body>
    <!-- Header -->
    <header>
        <nav class="container">
            <div class="logo">
                <img src="wolf-mark.webp" alt="Feral Systems Logo">
                Feral Systems
            </div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#feral-ai">Feral AI</a></li>
                <li><a href="#stakes">The Stakes</a></li>
                <li><a href="#methodology">Methodology</a></li>
                <li><a href="#advisory">Advisory</a></li>
                <li><a href="#speaking">Speaking</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <button class="mobile-menu-toggle">☰</button>
        </nav>
    </header>
